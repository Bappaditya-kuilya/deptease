<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeptEase API</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eff0f2;
        color: #16181d;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      }
      .card {
        background: #fff;
        border: 1px solid #e4e6ea;
        border-radius: 16px;
        padding: 32px 40px;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
        text-align: center;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0; color: #6e7178; font-size: 14px; }
      .pill {
        display: inline-block;
        margin-top: 14px;
        background: #1a1d21;
        color: #fff;
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 12px;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>DeptEase API</h1>
      <p>Student Department Management System — backend is live.</p>
      <span class="pill">/api/branch/stats</span>
    </div>
  </body>
</html>
